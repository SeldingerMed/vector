# Vector world catalog (next.md N10 / §2.4 / Appendix B).
#
# This file is data, not marketing. Four rules govern every edit:
#
# 1. Nothing here is invented. Every `license` was derived by reading the
#    upstream license *text* and identifying the SPDX expression from its
#    clauses - never from a README badge, a paper, or GitHub's detector, which
#    reports NOASSERTION for ORBIT-Surgical purely because the file is spelled
#    `LICENCE`. `NOASSERTION` means upstream ships no license file at all: that
#    is a finding (no license, no permission), not a gap to be excused.
# 2. `disposition` is the Appendix B verdict, except where verification
#    overturned it. Where the survey and the evidence disagree, the evidence
#    wins and the note says so.
# 3. `world_pin` is the full 40-char default-branch HEAD read from the GitHub
#    API on the audit date. A branch name is not a pin.
# 4. `metrics_only` records whether a hard safety gate could bind to a
#    physically-grounded signal *in that codebase*, with `safety_evidence`
#    naming the file, symbol, or command that established it. A shaped task
#    reward is not a safety signal (§2.2), and "it uses a physics engine" is
#    not evidence that the env exposes physics.
#
# Audit date: 2026-08-27. Method: GitHub API for HEAD/tags, raw license text
# for SPDX, upstream setup/install files for strategy, and - where the platform
# allowed - a real install into a throwaway venv on macOS arm64 (Apple M4 Max,
# no NVIDIA GPU) with the observed result recorded verbatim. Anything that
# needed CUDA, a compiled SOFA, or ROS was not install-tested here and says so
# rather than implying it was.

catalog_version = "2"

