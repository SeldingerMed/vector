metrics_only = false
determinism = "unmeasured"
determinism_evidence = """
Unmeasured. The in-tree conformance runs use the injected CI factory, which measures the \
harness, not this world. Run `surgeval conformance <task> -a random -n 2` against the \
first-party distribution before making a reproducibility claim.
"""
safety_evidence = """
docs/examples/tasks/lumen-nav-safe/task.toml binds hard gates to \
`lumen.info.unsafe` and `lumen.info.max_pen`, and the in-tree conformance run \
resolves both to pass/fail per trial rather than to an abstention.
"""
