The only world we author. The `lumen-gym` adapter and the `lumen-nav-safe` \
reference task ship in this repository; the physics package is the separate \
first-party `seldinger-lumen` distribution, which is why this is an install \
strategy at all rather than nothing.
"""
risks = """
The pinned sibling repository contains the Apache License 2.0 text and declares \
`Apache-2.0` in `pyproject.toml`. Determinism remains unmeasured, so a successful \
local import and rollout cannot establish replay equivalence.
"""

[worlds.install]
strategy = "first-party"
distribution = "seldinger-lumen"
verify_import = "lumen"
pinned_version = "0.0.0"

