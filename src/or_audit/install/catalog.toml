Highest-leverage single wrap (N2): inherits NVIDIA's asset investment and \
active maintenance. License is BSD-3-Clause, read from the file upstream \
spells `LICENCE` - GitHub's detector reports NOASSERTION for that reason \
alone, and our own license resolver missed the spelling until this audit.
"""
risks = """
Pins Isaac Lab 1.0.0 / Isaac Sim 4.1.0, an older generation than SonoGym's \
2.1.0 / 4.5.0, so one Isaac bridge cannot serve both without a compatibility \
path. Not install-tested here: needs an NVIDIA GPU and Linux.
"""

