[[worlds]]
id = "cathsim"
display_name = "CathSim"
domain = "Endovascular"
engine = "MuJoCo / dm-control"
disposition = "skip"
license = "CC-BY-NC-SA-4.0"
source = [
    "https://github.com/airvlab/cathsim",
    "arXiv:2208.01455",
]
world_kind = ""
world_pin = "adfabb2f291e31e6d656e66d0052269f38db01bd"
metrics_only = true
safety_evidence = """
Technically the best safety instrumentation in the survey, which is what makes \
the license loss real rather than academic. Verified by running it: \
`info["forces"]` and `info["contact_forces"]` carry live contact-force \
magnitudes (observed series 0.5564, 0.3580, 0.2629, 0.0, 0.0, 0.8761 N over 10 \
random steps; 7/10 non-zero), produced by Navigate.get_total_force / \
get_contact_forces in src/cathsim/dm/env.py. Both are opt-in \
(`use_force=True`, `use_contact_forces=True`, `return_info=True`; all default \
False), and termination is success-only.
"""
notes = """
Disposition changed from `wrap` to `skip`, and the reason is the license, not \
the code. Upstream LICENSE is the CC-BY-NC-SA-4.0 text ("NonCommercial means \
not primarily intended for or directed towards commercial advantage"), the \
pyproject classifier says "License :: Free for non-commercial use", and a \
separate TERMS.md adds field-of-use restrictions. That is a reviewed refusal in \
§2.4's denylist, so no amount of engineering makes it shippable here. This \
repository's existing CathSim firewall for Lumen stands.
"""
risks = """
Also technically broken as a pip target, which the previous `pip-extra` row \
would have promised: `cathsim` is not on PyPI (404), `pip install git+...` \
yields a namespace package whose `dm/config/env.yaml` is missing so no env can \
be constructed, `pympler` is imported but undeclared, and upstream is \
incompatible with Gymnasium 1.x (`wrappers.FrameStack` removed) so it needs \
`gymnasium==0.29.1`. A working local run required a source checkout plus both \
fixes. Recorded because someone will otherwise retry this and lose the day.
"""

[worlds.install]
strategy = "source-build"
repo = "https://github.com/airvlab/cathsim"
commit = "adfabb2f291e31e6d656e66d0052269f38db01bd"
build_docs = "https://github.com/airvlab/cathsim#installation"
requires = ["Python <= 3.12 (labmaze has no cp313 wheel)", "gymnasium==0.29.1", "pympler"]
runtime_licenses = ["CC-BY-NC-SA-4.0"]
verify_import = "cathsim"

