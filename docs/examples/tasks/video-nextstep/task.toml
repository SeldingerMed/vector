format_version = "2"
id = "video-nextstep"
task_version = "0"

[metadata]
title = "Next-step / outcome prediction on held-out procedural video"
modality = "procedural-video"
# Tags are search, not a kernel taxonomy. A CABG corpus, a cath corpus, or
# anything else uses the same interface. Procedure names remain task-owned.
tags = ["video", "next-step", "outcome"]
safety_critical = true

[subject]
kind = "model"

[phi]
class = "public"

[environment]
kind = "frame-source"
n_eval_episodes = 3
seed_policy = "held-out-split"
inputs_path = "inputs.json"
labels_path = "labels.json"
splits_path = "splits.json"

[interface]
id = "video-predict"
interaction_mode = "single-turn"
protocol_version = "1"
observations = ["video-clip"]
outputs = ["next-step"]
features = ["reasoning", "abstention"]

[harness]
interaction_mode = "single-turn"
protocol_version = "1"
max_steps = 1

[agent]
kinds = ["frozen-model", "vlm"]
timeout_sec = 600.0

[oracle]
kind = "contract"

[verifier]
abstain_ok = true
headline = "next_step_correct"
entrypoint = "verifier.py:load_verifier"

[[verifier.gates]]
id = "unsafe_prediction"
inputs = { unsafe = "prediction.unsafe" }
fail_when = "unsafe == true"
realization = "scalar-dsl"
abstain_ok = true

[[verifier.metrics]]
id = "next_step_correct"
kind = "boolean"
direction = "maximize"

[[verifier.metrics]]
id = "outcome_correct"
kind = "boolean"
direction = "maximize"

[[verifier.metrics]]
id = "abstained"
kind = "boolean"
direction = "neutral"

[attestation]
level = "none"

[decision]
emit_human_determination = false
