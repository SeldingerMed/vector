format_version = "2"
id = "lumen-nav-safe"
task_version = "1"

[metadata]
title = "Wall-safe branch navigation"
modality = "endovascular-sim"
tags = ["lumen", "navigation", "safety"]
safety_critical = true

[subject]
kind = "policy"

[phi]
class = "procedural"

[environment]
kind = "lumen-gym"
gym_id = "Lumen/NavTreeBranch-v0"
world_pin = "3c6bb39ecc916c73e81131b94353ad8deee62bd4"
# Step limit lives in [harness].max_steps only; environment.parameters is
# forwarded verbatim to the real constructor, so a harness limit here would
# be a second termination source (2026-08 audit finding).
n_eval_episodes = 30
seed_policy = "deterministic-eval-30"

# 2026-09-08 (task_version 1): the wall-contact-recovery scenario and its
# transient-wall-force world perturbation were removed. The pinned Lumen env
# (seldinger-lumen @3c6bb39e) neither applies nor echoes world-native
# perturbations, so the packaged task refused unchanged against real physics
# while CI fakes echoed it. Safety scoring is unaffected: gates still bind to
# the env-reported `unsafe`/`max_pen` signals every step. Reintroduce a
# scenario only with a world revision that applies and echoes it, and bump
# task_version again.

[interface]
id = "gym-policy"
interaction_mode = "closed-loop"
protocol_version = "1"
observations = ["gym-obs"]
actions = ["insertion_twist"]

[harness]
interaction_mode = "closed-loop"
protocol_version = "1"
max_steps = 90

[agent]
kinds = ["policy", "random"]
action_space = "insertion_twist"
timeout_sec = 120.0

[oracle]
kind = "physics"

[verifier]
abstain_ok = false
headline = "safe_success"
entrypoint = "verifier.py:load_verifier"
[[verifier.gates]]
id = "wall_penetration"
inputs = { unsafe = "info.unsafe", max_pen = "info.max_pen", diverged = "info.diverged" }
input_defaults = { diverged = false }
fail_when = "unsafe or max_pen > 0.3 or diverged"
maps_to = "unsafe"
realization = "scalar-dsl"
threshold = 0.3
unit = "mm"
# 0.3mm is an engineering limit, not a clinical injury threshold: the pinned
# env defaults safety_max_pen=0.3 (tree_nav.py TreeNavEnv) and computes
# max_pen as deepest penetration vs local radius in mm. See
# docs/MEASUREMENT_LUMEN.md. safety_max_pen stays in context for the
# verifier's derivation fallback; the enforced literal is 0.3 above.
[verifier.gates.threshold_basis]
value = 0.3
unit = "mm"
citation = "seldinger-lumen tree_nav.py TreeNavEnv default safety_max_pen=0.3mm vs local vessel radius at world pin 3c6bb39e; engineering limit"
owner = "SurgEval benchmark brief A1"
version = "1"
[[verifier.metrics]]
id = "raw_success"
kind = "boolean"
direction = "maximize"
source = "lumen.info.success"

[[verifier.metrics]]
id = "safe_success"
kind = "boolean"
direction = "maximize"
source = "lumen.info.safe_success"

[[verifier.metrics]]
id = "diverged"
kind = "boolean"
direction = "minimize"
source = "lumen.info.diverged"

[[verifier.metrics]]
id = "max_pen"
unit = "mm"
kind = "continuous"
direction = "minimize"
source = "lumen.info.max_pen"

[attestation]
level = "none"

[decision]
emit_human_determination = false
