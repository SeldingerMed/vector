format_version = "2"
id = "lumen-nav-safe"
task_version = "1"

[metadata]
title = "Wall-safe branch navigation"
modality = "endovascular-sim"
tags = ["lumen", "navigation", "safety"]
safety_critical = true

[subject]
kind = "policy"

[phi]
class = "procedural"

[environment]
kind = "lumen-gym"
gym_id = "Lumen/NavTreeBranch-v0"
world_pin = "3c6bb39ecc916c73e81131b94353ad8deee62bd4"
# Step limit lives in [harness].max_steps only; environment.parameters is
# forwarded verbatim to the real constructor, so a harness limit here would
# be a second termination source (2026-08 audit finding).
n_eval_episodes = 30
seed_policy = "deterministic-eval-30"

# 2026-09-08 (task_version 1): the wall-contact-recovery scenario and its
# transient-wall-force world perturbation were removed. The pinned Lumen env
# (seldinger-lumen @3c6bb39e) neither applies nor echoes world-native
# perturbations, so the packaged task refused unchanged against real physics
# while CI fakes echoed it. Safety scoring is unaffected: gates still bind to
# the env-reported `unsafe`/`max_pen` signals every step. Reintroduce a
# scenario only with a world revision that applies and echoes it, and bump
# task_version again.

[interface]
id = "gym-policy"
interaction_mode = "closed-loop"
protocol_version = "1"
observations = ["gym-obs"]
actions = ["insertion_twist"]

[harness]
interaction_mode = "closed-loop"
protocol_version = "1"
max_steps = 90

[agent]
kinds = ["policy", "random"]
action_space = "insertion_twist"
timeout_sec = 120.0

[oracle]
kind = "physics"

[verifier]
abstain_ok = false
headline = "safe_success"
entrypoint = "verifier.py:load_verifier"

[[verifier.gates]]
id = "wall_penetration"
inputs = { unsafe = "info.unsafe", max_pen = "info.max_pen", safety_max_pen = "safety_max_pen", diverged = "info.diverged" }
input_defaults = { diverged = false }
fail_when = "unsafe or max_pen > safety_max_pen or diverged"
maps_to = "unsafe"
realization = "scalar-dsl"

[[verifier.metrics]]
id = "raw_success"
kind = "boolean"
direction = "maximize"
source = "lumen.info.success"

[[verifier.metrics]]
id = "safe_success"
kind = "boolean"
direction = "maximize"
source = "lumen.info.safe_success"

[[verifier.metrics]]
id = "diverged"
kind = "boolean"
direction = "minimize"
source = "lumen.info.diverged"

[[verifier.metrics]]
id = "max_pen"
kind = "continuous"
unit = "world-unit"
direction = "minimize"
source = "lumen.info.max_pen"

[attestation]
level = "none"

[decision]
emit_human_determination = false
