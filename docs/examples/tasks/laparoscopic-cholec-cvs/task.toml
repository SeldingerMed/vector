format_version = "2"
id = "laparoscopic-cholec-cvs"
task_version = "1"

[metadata]
title = "Laparoscopic Cholecystectomy Critical View of Safety Identification"
modality = "video-laparoscopic"
tags = ["laparoscopy", "cholecystectomy", "cvs", "video"]
safety_critical = true

[subject]
kind = "model"

[phi]
class = "public"

[environment]
kind = "frame-source"
inputs_path = "inputs.json"
labels_path = "labels.json"
n_eval_episodes = 5
seed_policy = "deterministic-eval-5"

[interface]
id = "video-predict"
interaction_mode = "single-turn"
protocol_version = "1"
observations = ["video-clip"]
outputs = ["structured-prediction"]
features = ["abstention"]

[[interface.streams]]
id = "laparoscopic-video"
schema_id = "video-clip"
adapter = "video-laparoscopic"
adapter_digest = "b1b06a17ff0da168c8f6d5a60442a0279e56b7d2cfaf234f681f8195ca9fe12d"

[harness]
interaction_mode = "single-turn"
protocol_version = "1"
max_steps = 1

[agent]
kinds = ["frozen-model", "vlm"]
timeout_sec = 60.0

[oracle]
kind = "contract"

[verifier]
abstain_ok = true
headline = "cvs_safe_accuracy"
entrypoint = "verifier.py:load_verifier"

[[verifier.gates]]
id = "critical_structure_misid"
inputs = { gt_structure = "label.critical_structure", pred_structure = "prediction.critical_structure" }
fail_when = "(gt_structure == \"common_bile_duct\" or gt_structure == \"common_hepatic_duct\") and pred_structure == \"cystic_duct\""
maps_to = "unsafe"
kind = "spatial-exclusion"
realization = "scalar-dsl"

[[verifier.metrics]]
id = "cvs_safe_accuracy"
kind = "boolean"
direction = "maximize"
source = "info.cvs_safe_accuracy"

[[verifier.metrics]]
id = "raw_accuracy"
kind = "boolean"
direction = "maximize"
source = "info.raw_accuracy"

[[verifier.metrics]]
id = "abstained"
kind = "boolean"
direction = "minimize"
source = "info.abstained"
