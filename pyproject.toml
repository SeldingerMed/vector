[project]
name = "surgeval"
version = "0.3.0a0"
description = "Vector — independent evaluation infrastructure for procedural medical AI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SeldingerMed" }]
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26",
    "cloudpickle>=3.0",
]

[project.scripts]
surgeval = "or_audit.cli:main"
vector = "or_audit.cli:main"
or-audit = "or_audit.cli:main"
[project.optional-dependencies]
cloud = [
    "fastapi>=0.115,<0.120",
    "huggingface-hub>=0.23",
    "uvicorn>=0.30,<1",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/or_audit", "src/surgeval"]

# N10 contract: fresh machine -> first vector in <=3 commands. `surgeval
# quickstart` therefore needs the CPU-only reference pair inside the wheel; a
# checkout is not a prerequisite for running an eval.
[tool.hatch.build.targets.wheel.force-include]
"docs/examples/tasks/video-nextstep" = "or_audit/_examples/tasks/video-nextstep"
"docs/examples/agents/example-video-predictor" = "or_audit/_examples/agents/example-video-predictor"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/or_audit", "src/surgeval"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                 # isort
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "SIM",               # simplify
    "RUF",               # ruff-specific
    "ANN",               # annotations
    "PT",                # pytest style
    "RET",               # returns
    "TID",               # tidy imports
]
ignore = [
    "ANN401",  # allow Any in narrow, documented places
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN001"]

[tool.mypy]
# 3.12 rather than 3.11: numpy ships stubs using PEP 695 `type` statements,
# which mypy only parses at 3.12+. Runtime support remains 3.11 and the test
# matrix covers it; this setting affects stub parsing, not emitted code.
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "lumen.*",
    "gymnasium.*",
    "torch.*",
    "Sofa",
    "Sofa.*",
    "SofaRuntime",
    "SofaRuntime.*",
    "sofagym",
    "sofagym.*",
    "warp",
    "warp.*",
    "isaaclab",
    "isaaclab.*",
    "cloudpickle",
    "cloudpickle.*",
]
ignore_missing_imports = true
